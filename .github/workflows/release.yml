name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Check npm trusted publishing support
        run: |
          node -e 'const [major, minor, patch] = process.env.npm_config_user_agent.match(/npm\/(\d+)\.(\d+)\.(\d+)/).slice(1).map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { throw new Error("npm >= 11.5.1 is required") }'
      - name: Verify version and tag
        run: |
          node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); const tag = process.env.RELEASE_TAG; if (tag !== `v${pkg.version}`) { throw new Error(`Tag ${tag} does not match package version ${pkg.version}`) }'
          git show-ref --tags --verify "refs/tags/${RELEASE_TAG}"
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify packed package
        run: npm run package:check
      - name: Keep private development packages unpublished
        run: node -e 'const pkg = require("./package.json"); if (pkg.private === true) { throw new Error("package.json is private; approve release preparation before publishing") }'
      - name: Publish with npm trusted publishing
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: npm publish --provenance --access public
